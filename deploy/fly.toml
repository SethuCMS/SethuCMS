# SethuCMS gateway on Fly.io, run from the public image on ghcr (no build on Fly).
#
# Status: written, NOT run against a real Fly account. Check each step.
#
# One-time setup (on your computer, with flyctl installed and `fly auth login` done):
#   1. Pick a unique app name below, then:   fly apps create <app-name>
#   2. Create a Postgres for the shared state (Fly Managed Postgres, or an outside one such as Neon)
#      and copy its connection string.
#   3. Set the secrets (never put them in this file or in git):
#        fly secrets set -a <app-name> \
#          SETHUCMS_VAULT_KEY="$(openssl rand -base64 32)" \
#          SETHUCMS_CURSOR_SECRET="$(openssl rand -base64 32)" \
#          SETHUCMS_PREVIEW_SECRET="$(openssl rand -base64 32)" \
#          SETHUCMS_ADMIN_TOKEN="$(openssl rand -hex 32)" \
#          SETHUCMS_STATE_URL="postgres://..."
#      Copy SETHUCMS_VAULT_KEY into a password manager first: without it saved database
#      passwords cannot be decrypted, even from a backup.
#   4. Deploy:   fly deploy -a <app-name> -c deploy/fly.toml
#   5. HTTPS name:   fly certs add cms.kasinadhsarma.in -a <app-name>
#      then add the DNS records that command prints.
#   6. Check:   curl -fsS https://cms.kasinadhsarma.in/v1/health
app = "sethucms-gateway"        # change: Fly app names are global
primary_region = "sin"

[build]
  image = "ghcr.io/sethucms/sethucms:0.1.0"

[env]
  NODE_ENV = "production"
  PORT = "8080"
  HOST = "0.0.0.0"
  # State lives in Postgres (SETHUCMS_STATE_URL), so nothing is kept on disk.
  SETHUCMS_DATA_DIR = "memory"
  # Fly's proxy sits in front of the gateway.
  SETHUCMS_TRUST_PROXY = "true"

[http_service]
  internal_port = 8080
  force_https = true
  # The built-in worker sends webhooks and live events are long-lived, so keep one machine running.
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

  [[http_service.checks]]
    grace_period = "20s"
    interval = "30s"
    timeout = "5s"
    method = "GET"
    path = "/v1/health"

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
