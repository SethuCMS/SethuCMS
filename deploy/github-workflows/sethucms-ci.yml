# Build and test SethuCMS on every push and pull request.
#
# SethuCMS is four repositories that link to each other by folder, so this job checks
# out all four side by side and builds them in the same order as scripts/build-all.sh.
# Set the repository variables SETHUCMS_OWNER (your GitHub user or organisation) if the
# other repositories are not under the same owner as this one.
#
# Status: written but not run. Action versions are tags, not commit SHAs (see deploy/README.md).
name: ci
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      OWNER: ${{ vars.SETHUCMS_OWNER || github.repository_owner }}
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: ci-only-password
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
        with: { path: sethucms, persist-credentials: false }
      - uses: actions/checkout@v4
        with: { repository: "${{ env.OWNER }}/sethucms-adapter-sdk", path: sethucms-adapter-sdk, persist-credentials: false }
      - uses: actions/checkout@v4
        with: { repository: "${{ env.OWNER }}/sethucms-adapters", path: sethucms-adapters, persist-credentials: false }
      - uses: actions/checkout@v4
        with: { repository: "${{ env.OWNER }}/sethucms-admin", path: sethucms-admin, persist-credentials: false }
      - uses: pnpm/action-setup@v4
        with: { version: 9.15.0 }
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: Build everything
        working-directory: sethucms
        run: sh scripts/build-all.sh
      - name: Gateway tests (includes two gateways on Postgres and the Python adapter)
        working-directory: sethucms/apps/api
        env:
          SETHUCMS_TEST_PG_HOST: 127.0.0.1
          SETHUCMS_TEST_PG_PORT: "5432"
          SETHUCMS_TEST_PG_USER: postgres
          SETHUCMS_TEST_PG_PASSWORD: ci-only-password
        run: pnpm test
      - name: Adapter SDK tests
        working-directory: sethucms-adapter-sdk
        run: pnpm test
