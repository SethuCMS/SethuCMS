# Build the gateway image and publish it to GitHub Container Registry when you push a tag like v0.1.0.
# One image: the gateway with the admin app inside. The worker runs from the same image.
#
# Status: written but not run. Built for linux/amd64 only; ARM has not been tried.
name: release-image
on:
  push:
    tags: ["v*"]
permissions:
  contents: read
  packages: write
  id-token: write        # build provenance
  attestations: write
jobs:
  image:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      OWNER: ${{ vars.SETHUCMS_OWNER || github.repository_owner }}
    steps:
      - uses: actions/checkout@v4
        with: { path: sethucms, persist-credentials: false }
      - uses: actions/checkout@v4
        with: { repository: "${{ env.OWNER }}/sethucms-adapter-sdk", path: sethucms-adapter-sdk, persist-credentials: false }
      - uses: actions/checkout@v4
        with: { repository: "${{ env.OWNER }}/sethucms-adapters", path: sethucms-adapters, persist-credentials: false }
      - uses: actions/checkout@v4
        with: { repository: "${{ env.OWNER }}/sethucms-admin", path: sethucms-admin, persist-credentials: false }
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/sethucms
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
      - id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: sethucms/docker/Dockerfile.gateway
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          provenance: true
          sbom: true
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - uses: actions/attest-build-provenance@v2
        with:
          subject-name: ghcr.io/${{ github.repository_owner }}/sethucms
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true
