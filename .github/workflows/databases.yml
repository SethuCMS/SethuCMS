name: Databases
# Runs the adapters against REAL database servers, one job per database, so a
# failure points at exactly one server. Kept apart from "Everything" (build,
# unit tests, Docker image, examples) so each can be read, re-run and required
# on its own.
#
#   mongodb · firestore (emulator) · mysql · mariadb · postgres · migration
#
# Repositories link to each other by folder until the packages are on npm, so
# the shared "workspace" action checks out and builds them next to this one.
# While they are private, add a repository secret CROSS_REPO_TOKEN.

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "47 2 * * *"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  mongodb:
    name: MongoDB 7
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      mongo:
        image: mongo:7
        env:
          MONGO_INITDB_ROOT_USERNAME: sethu
          MONGO_INITDB_ROOT_PASSWORD: test
        ports: ["27017:27017"]
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.runCommand({ping:1})'"
          --health-interval 5s --health-timeout 5s --health-retries 20
    steps:
      - uses: actions/checkout@v7
        with:
          path: sethucms
      - uses: ./sethucms/.github/actions/workspace
        with:
          token: ${{ secrets.CROSS_REPO_TOKEN }}
      - run: pnpm test
        working-directory: sethucms-adapters/packages/mongodb
        env:
          SETHUCMS_TEST_MONGO_URL: mongodb://sethu:test@127.0.0.1:27017

  firestore:
    name: Firestore emulator
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          path: sethucms
      - uses: ./sethucms/.github/actions/workspace
        with:
          token: ${{ secrets.CROSS_REPO_TOKEN }}
      # A service container cannot take a start command, so run the emulator here.
      - name: Start the Firestore emulator
        run: |
          docker run -d --name fs -p 127.0.0.1:8080:8080 google/cloud-sdk:emulators \
            gcloud emulators firestore start --host-port=0.0.0.0:8080
          for i in $(seq 1 60); do
            curl -fsS http://127.0.0.1:8080/ >/dev/null 2>&1 && exit 0
            sleep 2
          done
          docker logs fs
          echo "the Firestore emulator did not start"
          exit 1
      - run: pnpm test
        working-directory: sethucms-adapters/packages/firestore
        env:
          SETHUCMS_TEST_FIRESTORE_EMULATOR: 127.0.0.1:8080
      # The gateway's own state (single gateway and serverless) through the real driver.
      - name: Build the gateway
        run: pnpm --filter @sethucms/api build
        working-directory: sethucms
      - name: Gateway state in the Firestore emulator
        run: node --test dist/tests/firestore-state.live.test.js
        working-directory: sethucms/apps/api
        env:
          SETHUCMS_TEST_FIRESTORE_EMULATOR: 127.0.0.1:8080

  mysql:
    name: MySQL 8
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      mysql:
        image: mysql:8
        env:
          MYSQL_ROOT_PASSWORD: test
        ports: ["3306:3306"]
        options: >-
          --health-cmd "mysqladmin ping -h 127.0.0.1 -uroot -ptest"
          --health-interval 5s --health-timeout 5s --health-retries 30
    steps:
      - uses: actions/checkout@v7
        with:
          path: sethucms
      - uses: ./sethucms/.github/actions/workspace
        with:
          token: ${{ secrets.CROSS_REPO_TOKEN }}
      - run: pnpm test
        working-directory: sethucms-adapters/packages/mysql
        env:
          SETHUCMS_TEST_MYSQL_URL: mysql://root:test@127.0.0.1:3306

  mariadb:
    name: MariaDB 11
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      mariadb:
        image: mariadb:11
        env:
          MARIADB_ROOT_PASSWORD: test
        ports: ["3306:3306"]
        options: >-
          --health-cmd "mariadb-admin ping -h 127.0.0.1 -uroot -ptest"
          --health-interval 5s --health-timeout 5s --health-retries 30
    steps:
      - uses: actions/checkout@v7
        with:
          path: sethucms
      - uses: ./sethucms/.github/actions/workspace
        with:
          token: ${{ secrets.CROSS_REPO_TOKEN }}
      - run: pnpm test
        working-directory: sethucms-adapters/packages/mysql
        env:
          SETHUCMS_TEST_MYSQL_URL: mysql://root:test@127.0.0.1:3306

  postgres:
    name: PostgreSQL 16
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      SETHUCMS_TEST_PG_URL: postgres://postgres:test@127.0.0.1:5432/postgres
      SETHUCMS_TEST_PG_HOST: 127.0.0.1
      SETHUCMS_TEST_PG_PORT: "5432"
      SETHUCMS_TEST_PG_USER: postgres
      SETHUCMS_TEST_PG_PASSWORD: test
      SETHUCMS_TEST_PG_DB: postgres
    steps:
      - uses: actions/checkout@v7
        with:
          path: sethucms
      - uses: ./sethucms/.github/actions/workspace
        with:
          token: ${{ secrets.CROSS_REPO_TOKEN }}
      - run: pnpm test
        working-directory: sethucms-adapters/packages/postgres

  migration:
    name: Migration across MongoDB, MySQL and PostgreSQL
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      mongo:
        image: mongo:7
        env:
          MONGO_INITDB_ROOT_USERNAME: sethu
          MONGO_INITDB_ROOT_PASSWORD: test
        ports: ["27017:27017"]
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.runCommand({ping:1})'"
          --health-interval 5s --health-timeout 5s --health-retries 20
      mysql:
        image: mysql:8
        env:
          MYSQL_ROOT_PASSWORD: test
        ports: ["3306:3306"]
        options: >-
          --health-cmd "mysqladmin ping -h 127.0.0.1 -uroot -ptest"
          --health-interval 5s --health-timeout 5s --health-retries 30
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v7
        with:
          path: sethucms
      - uses: ./sethucms/.github/actions/workspace
        with:
          token: ${{ secrets.CROSS_REPO_TOKEN }}
      - name: Build the gateway
        run: pnpm --filter @sethucms/api build
        working-directory: sethucms
      - run: node --test dist/tests/migration-cross.test.js
        working-directory: sethucms/apps/api
        env:
          SETHUCMS_TEST_MONGO_URL: mongodb://sethu:test@127.0.0.1:27017
          SETHUCMS_TEST_MYSQL_URL: mysql://root:test@127.0.0.1:3306
          SETHUCMS_TEST_PG_URL: postgres://postgres:test@127.0.0.1:5432/postgres

  # One check to require in branch protection.
  databases-ok:
    name: Databases OK
    if: always()
    needs: [mongodb, firestore, mysql, mariadb, postgres, migration]
    runs-on: ubuntu-latest
    steps:
      - run: |
          for r in "${{ needs.mongodb.result }}" "${{ needs.firestore.result }}" \
                   "${{ needs.mysql.result }}" "${{ needs.mariadb.result }}" \
                   "${{ needs.postgres.result }}" "${{ needs.migration.result }}"; do
            [ "$r" = "success" ] || { echo "a database job: $r"; exit 1; }
          done
